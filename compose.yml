services:

  app:
    build: .
    container_name: task-app
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/taskdb
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
